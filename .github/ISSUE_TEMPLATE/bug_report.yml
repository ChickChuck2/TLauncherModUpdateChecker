name: "🐛 Relatório de Bug"
description: "Crie um relatório para nos ajudar a identificar e corrigir um problema."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por dedicar seu tempo para relatar um problema!
  - type: input
    id: version
    attributes:
      label: Versão do TLauncher Mod Update Checker
      placeholder: "Ex: v1.0.0"
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Versão do Minecraft & Loader
      placeholder: "Ex: 1.20.1 Forge 47.2.20"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descrição do Problema
      placeholder: Descreva detalhadamente o que aconteceu...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      placeholder: |
        1. Abrir o programa
        2. Selecionar o modpack X
        3. Clicar em Atualizar
    validations:
      required: true
